name: "Default"
version: "1.1.0"
author: "Mcaster1"
description: "System default theme — uses Fusion palette with clean, polished styling"
base_palette: "fusion"

colors:
  primary: "palette(window)"
  secondary: "palette(base)"
  accent: "palette(highlight)"
  highlight: "palette(highlight)"
  text_primary: "palette(windowText)"
  text_secondary: "palette(placeholderText)"
  meter_green: "#22c55e"
  meter_yellow: "#eab308"
  meter_red: "#ef4444"
  timeline_bg: "palette(base)"
  waveform_color: "palette(highlight)"
  track_header_bg: "palette(window)"
  transport_bg: "palette(window)"
  border: "palette(mid)"
  fader_groove: "palette(dark)"
  fader_handle: "palette(highlight)"
  record_red: "#ef4444"
  onair_green: "#22c55e"
  mute_orange: "#f97316"
  solo_yellow: "#eab308"
  button_bg: "palette(button)"
  button_border: "palette(mid)"

button_style: "flat"
knob_style: "embossed"
meter_style: "gradient"
