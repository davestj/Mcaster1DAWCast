name: "Default"
version: "1.0.0"
author: "Mcaster1"
description: "System default theme — uses native platform colors with minimal overrides"
base_palette: "fusion"

colors:
  primary: "palette(window)"
  secondary: "palette(base)"
  accent: "palette(highlight)"
  highlight: "palette(highlight)"
  text_primary: "palette(windowText)"
  text_secondary: "palette(placeholderText)"
  meter_green: "#00cc41"
  meter_yellow: "#cccc00"
  meter_red: "#cc0000"
  timeline_bg: "palette(base)"
  waveform_color: "palette(highlight)"
  track_header_bg: "palette(window)"
  transport_bg: "palette(window)"
  border: "palette(mid)"

button_style: "beveled"
knob_style: "embossed"
meter_style: "gradient"
