<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main background gradient — deep dark blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2840"/>
      <stop offset="50%" style="stop-color:#151821"/>
      <stop offset="100%" style="stop-color:#0f1119"/>
    </linearGradient>
    <!-- Teal accent gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5eebd4"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <!-- 3D highlight for top-left -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Glow effect -->
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </radialGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <!-- App icon rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle inner border -->
  <rect x="18" y="18" width="476" height="476" rx="94" ry="94" fill="none" stroke="#2a2e3e" stroke-width="1.5"/>

  <!-- Glow behind the waveform -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#glow)"/>

  <!-- 3D highlight overlay -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#highlight)"/>

  <!-- Audio waveform — the main icon element -->
  <g transform="translate(256, 220)" stroke="url(#tealGrad)" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- Symmetric waveform bars -->
    <line x1="-140" y1="-20" x2="-140" y2="20"/>
    <line x1="-120" y1="-40" x2="-120" y2="40"/>
    <line x1="-100" y1="-65" x2="-100" y2="65"/>
    <line x1="-80" y1="-45" x2="-80" y2="45"/>
    <line x1="-60" y1="-80" x2="-60" y2="80"/>
    <line x1="-40" y1="-55" x2="-40" y2="55"/>
    <line x1="-20" y1="-95" x2="-20" y2="95"/>
    <line x1="0" y1="-70" x2="0" y2="70"/>
    <line x1="20" y1="-100" x2="20" y2="100"/>
    <line x1="40" y1="-60" x2="40" y2="60"/>
    <line x1="60" y1="-85" x2="60" y2="85"/>
    <line x1="80" y1="-50" x2="80" y2="50"/>
    <line x1="100" y1="-70" x2="100" y2="70"/>
    <line x1="120" y1="-35" x2="120" y2="35"/>
    <line x1="140" y1="-15" x2="140" y2="15"/>
  </g>

  <!-- Broadcast/cast icon (small) — bottom-right of waveform -->
  <g transform="translate(340, 160)" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round">
    <circle cx="0" cy="0" r="5" fill="#ef4444"/>
    <path d="M-12,-12 A17,17 0 0,1 12,-12" />
    <path d="M-20,-20 A28,28 0 0,1 20,-20" />
  </g>

  <!-- "DAWCast" text -->
  <text x="256" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52"
        font-weight="800" fill="#f0f0f0" text-anchor="middle" letter-spacing="3">DAWCast</text>

  <!-- "Mcaster1" small text above -->
  <text x="256" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22"
        font-weight="500" fill="#8892a4" text-anchor="middle" letter-spacing="2">MCASTER1</text>

  <!-- Subtle version dot -->
  <circle cx="256" cy="430" r="3" fill="#2dd4bf" opacity="0.5"/>
</svg>
