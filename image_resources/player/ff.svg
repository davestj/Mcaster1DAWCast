  <polygon points="64,38 64,86 92,62" fill="url(#symFace)"/>
  <polygon points="36,38 36,62 64,62" fill="url(#symGloss)"/>
  <polygon points="64,38 64,62 92,62" fill="url(#symGloss)"/>
  <line x1="37" y1="40" x2="37" y2="86" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6"/>
