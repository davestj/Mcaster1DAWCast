      <stop offset="0.25" stop-color="#d0d0dc"/>
      <stop offset="0.65" stop-color="#6c6c7c"/>
      <stop offset="1"    stop-color="#1a1a22"/>
    </linearGradient>
    <linearGradient id="symGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
