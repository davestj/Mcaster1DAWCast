  <circle cx="64" cy="64" r="52" fill="url(#capInner)"/>
  <ellipse cx="64" cy="30" rx="42" ry="14" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Two forward triangles, span x=36..92 -->
