<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3a3a44"/>
      <stop offset="0.5"  stop-color="#1c1c24"/>
      <stop offset="1"    stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="capRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#787888"/>
      <stop offset="0.5" stop-color="#404048"/>
      <stop offset="1"   stop-color="#202028"/>
    </linearGradient>
    <radialGradient id="capInner" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0"   stop-color="#5a5a66"/>
      <stop offset="0.6" stop-color="#1e1e26"/>
      <stop offset="1"   stop-color="#080810"/>
    </radialGradient>
    <linearGradient id="symFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#a0ffb0"/>
      <stop offset="0.25" stop-color="#5fe060"/>
      <stop offset="0.65" stop-color="#1f9028"/>
      <stop offset="1"    stop-color="#0a4012"/>
    </linearGradient>
    <linearGradient id="symGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer drop shadow -->
  <ellipse cx="64" cy="118" rx="44" ry="6" fill="#000" fill-opacity="0.55"/>

  <!-- Outer chrome rim (raised button cap) -->
  <circle cx="64" cy="64" r="58" fill="url(#capRim)"/>

  <!-- Inner cap face -->
  <circle cx="64" cy="64" r="52" fill="url(#capInner)"/>

  <!-- Subtle inner top highlight -->
  <ellipse cx="64" cy="30" rx="42" ry="14" fill="#ffffff" fill-opacity="0.14"/>

  <!-- ── PLAY triangle (3D extruded look) ── -->
  <!-- Bottom face / extrusion shadow -->
  <polygon points="49,40 49,90 92,67" fill="#000" fill-opacity="0.7"/>
  <polygon points="49,38 49,88 90,65" fill="#0a4012"/>
  <!-- Main face -->
  <polygon points="48,36 48,86 88,63" fill="url(#symFace)"/>
  <!-- Glossy upper half -->
  <polygon points="48,36 48,63 88,63" fill="url(#symGloss)"/>
  <!-- Bright leading edge -->
  <line x1="49" y1="38" x2="49" y2="84" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  <!-- Specular dot -->
  <ellipse cx="58" cy="46" rx="6" ry="2.5" fill="#ffffff" fill-opacity="0.65"/>
</svg>
