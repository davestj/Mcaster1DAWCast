<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="capRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#787888"/>
      <stop offset="0.5" stop-color="#404048"/>
      <stop offset="1"   stop-color="#202028"/>
    </linearGradient>
    <radialGradient id="capInner" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0"   stop-color="#5a5a66"/>
      <stop offset="0.6" stop-color="#1e1e26"/>
      <stop offset="1"   stop-color="#080810"/>
    </radialGradient>
    <linearGradient id="symFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ff9090"/>
      <stop offset="0.25" stop-color="#ee4040"/>
      <stop offset="0.65" stop-color="#9c1818"/>
      <stop offset="1"    stop-color="#3a0606"/>
    </linearGradient>
    <linearGradient id="symGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="118" rx="44" ry="6" fill="#000" fill-opacity="0.55"/>
  <circle cx="64" cy="64" r="58" fill="url(#capRim)"/>
  <circle cx="64" cy="64" r="52" fill="url(#capInner)"/>
  <ellipse cx="64" cy="30" rx="42" ry="14" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Stop square 38..90, 38..90 -->
  <rect x="40" y="42" width="50" height="50" rx="4" fill="#000" fill-opacity="0.7"/>
  <rect x="38" y="40" width="50" height="50" rx="4" fill="#3a0606"/>
  <rect x="38" y="38" width="50" height="50" rx="4" fill="url(#symFace)"/>
  <rect x="38" y="38" width="50" height="22" rx="4" fill="url(#symGloss)"/>
  <line x1="39" y1="40" x2="39" y2="86" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.6"/>
  <ellipse cx="56" cy="46" rx="14" ry="3" fill="#ffffff" fill-opacity="0.55"/>
</svg>
