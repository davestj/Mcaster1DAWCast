# Mcaster1DAWCast — Factory Track Preset
# General-purpose instrument processing chain
name: "Music Instrument"
description: "Clean instrument recording with light compression and EQ"
volume_db: -3.0
pan: 0.0
color: "#60a5fa"
effects:
  - type: "parametric_eq"
    params:
      band_0:
        type: "high_pass"
        freq: 40
        q: 0.707
        gain_db: 0
      band_1:
        type: "peaking"
        freq: 800
        q: 1.0
        gain_db: -1.5
      band_2:
        type: "peaking"
        freq: 5000
        q: 0.8
        gain_db: 2.0
  - type: "compressor"
    params:
      threshold_db: -16
      ratio: 3
      attack_ms: 15
      release_ms: 200
